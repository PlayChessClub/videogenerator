name: build-windows

on:
  push:
    tags: ['v*']
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并发布 Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 清空 NuGet 缓存
        shell: pwsh
        run: dotnet nuget locals all --clear

      - name: 还原依赖
        working-directory: Windows
        run: dotnet restore src/ClipForgeAI.Win.csproj

      - name: 编译(必须零错误)
        working-directory: Windows
        run: dotnet build src/ClipForgeAI.Win.csproj -c Release -p:Platform=${{ matrix.arch }} --no-restore

      - name: 发布(自包含 + Windows App SDK 运行时)
        working-directory: Windows
        run: |
          $out = "publish/${{ matrix.arch }}"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish src/ClipForgeAI.Win.csproj `
            -c Release -r win-${{ matrix.arch }} `
            -p:Platform=${{ matrix.arch }} `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -p:WindowsPackageType=None `
            -p:DebugType=embedded `
            -o $out --no-restore

      - name: 验证 ClipForge.exe
        working-directory: Windows
        run: |
          $exe = "publish/${{ matrix.arch }}/ClipForge.exe"
          if (-not (Test-Path $exe)) { throw "❌ 找不到 $exe" }
          Write-Host "✅ $exe 存在,$([math]::Round((Get-Item $exe).Length/1MB,1)) MB"

      - name: 打包 zip
        working-directory: Windows
        run: |
          $src = "publish/${{ matrix.arch }}"
          $dst = "publish/ClipForge-windows-${{ matrix.arch }}.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$src/*" -DestinationPath $dst -CompressionLevel Optimal
          Write-Host "✅ $dst,$([math]::Round((Get-Item $dst).Length/1MB,1)) MB"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-windows-${{ matrix.arch }}
          path: Windows/publish/ClipForge-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 确认双架构 zip 齐全
        working-directory: artifacts
        run: |
          ls -la
          [ -f ClipForge-windows-x64.zip ] || { echo "❌ 缺 x64 zip"; exit 1; }
          [ -f ClipForge-windows-ARM64.zip ] || { echo "❌ 缺 ARM64 zip"; exit 1; }
          echo "✅ 双架构 zip 都齐全"

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ClipForge Windows ${{ github.ref_name }}"
          generate_release_notes: true
          # false:不顶替 macOS v1.1.1 的 LATEST 标记
          make_latest: 'false'
          fail_on_unmatched_files: false
          files: |
            artifacts/ClipForge-windows-x64.zip
            artifacts/ClipForge-windows-ARM64.zip
          body: |
            ## ClipForge · Windows ${{ github.ref_name }}

            AI 视频编辑助手 · Windows 11 自包含发布版。

            - WinUI 3 + .NET 8 + Mica 系统材质
            - 声音克隆(cosyvoice-v3.5-plus)
            - 图生视频(wan2.6-i2v)
            - API Key 明文存在 %APPDATA%\ClipForge\settings.yml(请勿分享)

            ### 下载

            - **x64**:大多数 Intel/AMD 桌面和笔记本
            - **ARM64**:Surface Pro X、骁龙本等 ARM 设备

            ### 安装

            1. 解压 zip 到任意位置
            2. 双击 `ClipForge.exe` 启动
            3. 首次运行在「设置」里填入 DashScope API Key