name: build-windows

on:
  push:
    tags: ['v*']
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译并发布 Windows ${{ matrix.arch }}
    # 固定 windows-2022 而不是 windows-latest:
    # windows-latest 现在预装 .NET 10 SDK + VS v18 路径,但 Microsoft.Build.Packaging.Pri.Tasks.dll
    # 没装在那里,触发 WinAppSDK 1.6 的 MrtCore.PriGen.targets 报 MSB4062。
    # windows-2022 runner 装 .NET 8/9 SDK,路径适配 WinAppSDK 1.6。
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # PlatformTarget 需要首字母大写(x64 / ARM64),但 RuntimeIdentifier 需要全小写
        # (win-x64 / win-arm64)。分开定义避免大小写错。
        include:
          - arch: x64
            rid: win-x64
          - arch: ARM64
            rid: win-arm64

    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 清空 NuGet 缓存
        shell: pwsh
        run: dotnet nuget locals all --clear

      # GitHub Actions windows-2022 runner 缺 Microsoft.Build.Packaging.Pri.Tasks.dll
      # (v17.0/AppxPackage/ 目录不存在)。WinAppSDK 1.6 的 MrtCore.PriGen.targets
      # 调用 ExpandPriContent 任务会触发 MSB4062。
      # 解决方案:在 nuget 还原之前,先清空 WinAppSDK 缓存;还原之后 patch 它的
      # MrtCore.PriGen.targets,把所有 ExpandPriContent 调用改成 NoOpSkipPri
      # (一个 csproj 里的 no-op target)。
      - name: 预清空 WinAppSDK NuGet 缓存
        shell: pwsh
        run: |
          $cacheRoot = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk"
          if (Test-Path $cacheRoot) { Remove-Item $cacheRoot -Recurse -Force }
          Write-Host "已清空 WinAppSDK NuGet 缓存"

      - name: 还原依赖 + patch WinAppSDK targets
        working-directory: Windows
        shell: pwsh
        run: |
          dotnet restore src/ClipForgeAI.Win.csproj
          Write-Host "✅ 还原完成"

          $targetsFiles = Get-ChildItem `
            -Path "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk" `
            -Filter 'MrtCore.PriGen.targets' `
            -Recurse -ErrorAction SilentlyContinue
          $patchedCount = 0
          foreach ($tf in $targetsFiles) {
            $content = Get-Content $tf.FullName -Raw
            if ($content -match 'ExpandPriContent') {
              Write-Host "清空 $($tf.FullName)"
              # unpackaged 应用不需要 MRT/PRI 资源。把整个 MrtCore.PriGen.targets
              # 内容替换成一个「合法的空 <Project>」,这样:
              #   - MrtCore.targets 第 9 行的 <Import> 仍能正常加载(有根元素)
              #   - <UsingTask ... Pri.Tasks.ExpandPriContent> 不再被加载(根因:这个
              #     dll 在 GitHub Actions runner 上根本不存在,加载失败 MSB4062)
              #   - <ExpandPriContent> 内联 task 调用也一并消失
              Set-Content -Path $tf.FullName -Value '<?xml version="1.0" encoding="utf-8"?><Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003"></Project>' -NoNewline
              $patchedCount++
            }
          }
          Write-Host "✅ 已清空 $patchedCount 个 MrtCore.PriGen.targets 文件"

      - name: 编译(必须零错误)
        working-directory: Windows
        run: dotnet build src/ClipForgeAI.Win.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.arch }} --no-restore

      - name: 发布(自包含 + Windows App SDK 运行时)
        working-directory: Windows
        run: |
          $out = "publish/${{ matrix.arch }}"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          dotnet publish src/ClipForgeAI.Win.csproj `
            -c Release -r ${{ matrix.rid }} `
            -p:Platform=${{ matrix.arch }} `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -p:WindowsPackageType=None `
            -p:DebugType=embedded `
            -o $out --no-restore

      - name: 验证 ClipForge.exe
        working-directory: Windows
        run: |
          $exe = "publish/${{ matrix.arch }}/ClipForge.exe"
          if (-not (Test-Path $exe)) { throw "❌ 找不到 $exe" }
          Write-Host "✅ $exe 存在,$([math]::Round((Get-Item $exe).Length/1MB,1)) MB"

      - name: 打包 zip
        working-directory: Windows
        run: |
          $src = "publish/${{ matrix.arch }}"
          $dst = "publish/ClipForge-windows-${{ matrix.arch }}.zip"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          Compress-Archive -Path "$src/*" -DestinationPath $dst -CompressionLevel Optimal
          Write-Host "✅ $dst,$([math]::Round((Get-Item $dst).Length/1MB,1)) MB"

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-windows-${{ matrix.arch }}
          path: Windows/publish/ClipForge-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 确认双架构 zip 齐全
        working-directory: artifacts
        run: |
          ls -la
          [ -f ClipForge-windows-x64.zip ] || { echo "❌ 缺 x64 zip"; exit 1; }
          [ -f ClipForge-windows-ARM64.zip ] || { echo "❌ 缺 ARM64 zip"; exit 1; }
          echo "✅ 双架构 zip 都齐全"

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ClipForge Windows ${{ github.ref_name }}"
          generate_release_notes: true
          # false:不顶替 macOS v1.1.1 的 LATEST 标记
          make_latest: 'false'
          fail_on_unmatched_files: false
          files: |
            artifacts/ClipForge-windows-x64.zip
            artifacts/ClipForge-windows-ARM64.zip
          body: |
            ## ClipForge · Windows ${{ github.ref_name }}

            AI 视频编辑助手 · Windows 11 自包含发布版。

            - WinUI 3 + .NET 8 + Mica 系统材质
            - 声音克隆(cosyvoice-v3.5-plus)
            - 图生视频(wan2.6-i2v)
            - API Key 明文存在 %APPDATA%\ClipForge\settings.yml(请勿分享)

            ### 下载

            - **x64**:大多数 Intel/AMD 桌面和笔记本
            - **ARM64**:Surface Pro X、骁龙本等 ARM 设备

            ### 安装

            1. 解压 zip 到任意位置
            2. 双击 `ClipForge.exe` 启动
            3. 首次运行在「设置」里填入 DashScope API Key