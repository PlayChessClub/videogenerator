name: build-web

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 原生窗口版:内嵌 webkit2gtk(需 CGO),只能在 Linux runner 上编译。
  # ubuntu-24.04-arm 是免费公开仓库 arm64 runner,原生编译 arm64 无需交叉工具链。
  linux-window:
    name: Linux 窗口版 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: 装 webkit2gtk 开发头文件
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config

      - name: 编译(CGO,内嵌 webkit 窗口)
        shell: bash
        run: |
          python3 web/build-pkgs.py --only linux-${{ matrix.arch }} --cgo --deb
          ls -la web/release/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-linux-${{ matrix.arch }}
          path: |
            web/release/clipforge-linux-${{ matrix.arch }}.zip
            web/release/clipforge_3.2.0_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 14
