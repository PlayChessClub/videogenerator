name: build-web

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'web/**'
      - '.github/workflows/build-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux 版:纯静态(无 CGO)编译,zip 免安装 + deb(CLI+浏览器模式,无 webkit 依赖)。
  # ubuntu-24.04-arm 是免费公开仓库 arm64 runner,原生编译 arm64 无需交叉工具链。
  linux-build:
    name: Linux 版 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: 编译(静态,CLI+浏览器,无 CGO)
        shell: bash
        run: |
          python3 web/build-pkgs.py --only linux-${{ matrix.arch }} --deb
          ls -la web/release/

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-linux-${{ matrix.arch }}
          path: |
            web/release/clipforge-linux-${{ matrix.arch }}.zip
            web/release/clipforge_3.2.1_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 14
